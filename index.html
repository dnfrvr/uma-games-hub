<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>★ UMA Games — Jeux gratuits en ligne ★</title>
<link rel="icon" type="image/svg+xml" href="shared/vignettes/drew.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<!-- Même DA que les jeux : tout le mobilier vient de shared/ -->
<link rel="stylesheet" href="shared/style-tokens.css" />
<link rel="stylesheet" href="shared/components.css" />
<link rel="stylesheet" href="shared/navbar.css" />
<link rel="stylesheet" href="shared/sidebar.css" />
<link rel="stylesheet" href="shared/portail.css" />
<link rel="stylesheet" href="style-hub.css" />
</head>
<body>
  <div id="sparkles" aria-hidden="true"></div>

  <!-- En-tête du portail : barre de service, navigation, annonces -->
  <div id="navbar"></div>

  <div class="portail">
    <nav class="fil-ariane" aria-label="Fil d'Ariane">
      <span class="fil-actuel">Accueil</span>
      <span class="fil-sep">»</span>
      <span class="fil-actuel">Tous les jeux</span>
    </nav>

    <!-- Réclame maison, format bannière : remplie depuis le manifest -->
    <div class="pub pub-banniere" id="pub-haut"></div>

    <div class="portail-corps">
      <main class="portail-principal">

        <!-- ---------- Le jeu à la une ---------- -->
        <section class="bloc bloc-une" id="bloc-une" hidden>
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">▶</span>
            Le jeu à la une
            <span class="rubrique-info" id="une-date"></span>
          </h2>
          <div class="une" id="une"></div>
        </section>

        <!-- ---------- La grille ---------- -->
        <section class="bloc">
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">★</span>
            Tous les jeux
            <span class="rubrique-info" id="grille-compte"></span>
          </h2>

          <div class="onglets-tri" role="tablist" aria-label="Trier les jeux">
            <button class="onglet-tri actif" type="button" role="tab" data-tri="nouveaux">Nouveautés</button>
            <button class="onglet-tri" type="button" role="tab" data-tri="notes">Les mieux notés</button>
            <button class="onglet-tri" type="button" role="tab" data-tri="parties">Les plus joués</button>
            <button class="onglet-tri" type="button" role="tab" data-tri="alpha">A → Z</button>
          </div>

          <p class="filtre-actif" id="filtre-actif" hidden></p>

          <div id="grille-jeux" class="grille-jeux" aria-busy="true">
            <p class="chargement">Chargement des jeux…</p>
          </div>
        </section>

        <!-- ---------- Le classement ---------- -->
        <section class="bloc" id="bloc-top" hidden>
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">▲</span>
            Les plus joués de la semaine
            <span class="rubrique-info">mis à jour tous les lundis</span>
          </h2>
          <ol class="classement" id="classement"></ol>
        </section>
      </main>

      <!-- ---------- La colonne de droite ---------- -->
      <aside class="portail-cote">
        <section class="bloc" id="bloc-categories" hidden>
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">▤</span>
            Catégories
          </h2>
          <ul class="categories" id="categories"></ul>
        </section>

        <!-- Réclame maison, format pavé -->
        <div class="pub pub-pave" id="pub-cote"></div>

        <section class="bloc">
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">?</span>
            Le saviez-vous ?
          </h2>
          <p class="widget-texte" id="anecdote">…</p>
        </section>

        <section class="bloc widget-livre-dor">
          <h2 class="rubrique">
            <span class="rubrique-icone" aria-hidden="true">✎</span>
            Livre d'or
            <span class="rubrique-info" id="livre-compte"></span>
          </h2>
          <ul class="livre-dor" id="livre-dor"></ul>
        </section>
      </aside>
    </div>

    <!-- Pied de page du portail, commun à toutes les pages -->
    <div id="pied"></div>
  </div>

  <script src="shared/favoris.js"></script>
  <script src="shared/sparkle.js"></script>
  <script src="shared/navbar.js"></script>
  <script src="shared/pub.js"></script>
  <script src="shared/pied.js"></script>
  <script>
    renderNavbar(null, "navbar");
    renderPied("pied");
    renderPubs([["pub-haut", "banniere"], ["pub-cote", "pave"]]);
  </script>
<script>
/* =========================================================
   Le hub ne connaît aucun jeu en dur : tout vient de
   games-manifest.json, la source unique de vérité partagée avec
   l'en-tête et la colonne des pages de jeu.
   ========================================================= */
(function () {
  "use strict";

  const grille = document.getElementById("grille-jeux");
  const params = new URLSearchParams(location.search);

  /* L'état des filtres vient de l'URL : la recherche de la barre de service
     est un vrai formulaire GET, elle arrive donc ici avec ?q=. */
  const etat = {
    tri: "nouveaux",
    q: (params.get("q") || "").trim(),
    categorie: params.get("categorie") || "",
    favoris: params.get("favoris") === "1",
  };

  let JEUX = [];

  const nombre = (n) => Number(n || 0).toLocaleString("fr-FR");
  const virgule = (n) => String(n).replace(".", ",");
  const jouable = (j) => j.statut === "disponible" && j.url;

  const DATE_FR = { day: "numeric", month: "long", year: "numeric" };
  const enDate = (iso) => {
    const d = new Date(iso + "T12:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("fr-FR", DATE_FR);
  };

  fetch("games-manifest.json")
    .then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(demarre)
    .catch((err) => {
      console.error("[hub] manifest illisible :", err);
      grille.innerHTML =
        '<p class="chargement">Impossible de charger la liste des jeux. ' +
        "Sers le dossier avec un serveur local (python3 -m http.server).</p>";
      grille.removeAttribute("aria-busy");
    });

  function demarre(jeux) {
    JEUX = jeux;
    afficheUne();
    afficheCategories();
    afficheClassement();
    brancheTri();
    brancheHasardPied();
    afficheGrille();
  }

  /* ---------------------------------------------------------
     Cinq étoiles grises, cinq dorées rognées à la note.
     --------------------------------------------------------- */
  function etoiles(jeu, avecVotes) {
    const note = document.createElement("span");
    note.className = "notation";
    note.title = virgule(jeu.note) + " sur 10";

    const cinq = document.createElement("span");
    cinq.className = "notation-etoiles";
    const plein = document.createElement("i");
    plein.style.width = (jeu.note / 10) * 100 + "%";
    cinq.appendChild(plein);

    const chiffre = document.createElement("span");
    chiffre.className = "notation-chiffre";
    chiffre.textContent = virgule(jeu.note) + "/10";

    note.append(cinq, chiffre);

    if (avecVotes) {
      const votes = document.createElement("span");
      votes.className = "notation-votes";
      votes.textContent = nombre(jeu.votes) + " votes";
      note.appendChild(votes);
    }
    return note;
  }

  /* ---------------------------------------------------------
     Le jeu à la une : le dernier arrivé. Pas un choix arbitraire —
     c'est ce qu'un portail met en avant, et ça se voit dans la date.
     --------------------------------------------------------- */
  function afficheUne() {
    const jeux = JEUX.filter(jouable);
    if (!jeux.length) return;

    const jeu = jeux
      .slice()
      .sort((a, b) => String(b.ajoute_le).localeCompare(String(a.ajoute_le)))[0];

    document.getElementById("une-date").textContent = "en ligne depuis le " + enDate(jeu.ajoute_le);

    const une = document.getElementById("une");
    une.style.setProperty("--accent", jeu.couleur);
    une.innerHTML = "";

    const lienImg = document.createElement("a");
    lienImg.className = "une-ecran";
    lienImg.href = jeu.url;
    lienImg.setAttribute("aria-label", "Jouer à " + jeu.titre);

    const img = document.createElement("img");
    img.src = jeu.vignette;
    img.alt = "";
    lienImg.appendChild(img);

    const neuf = document.createElement("span");
    neuf.className = "ruban-nouveau";
    neuf.textContent = "NOUVEAU !";
    lienImg.appendChild(neuf);

    const texte = document.createElement("div");
    texte.className = "une-texte";

    const titre = document.createElement("h3");
    titre.className = "une-titre";
    const lienTitre = document.createElement("a");
    lienTitre.href = jeu.url;
    lienTitre.textContent = jeu.titre;
    titre.appendChild(lienTitre);

    const rang = document.createElement("p");
    rang.className = "une-meta";
    rang.append(etoiles(jeu, true));

    const desc = document.createElement("p");
    desc.className = "une-desc";
    desc.textContent = jeu.description;

    const fiche = document.createElement("dl");
    fiche.className = "fiche";
    [
      ["Catégorie", jeu.categorie],
      ["Contrôles", jeu.controles],
      ["Parties jouées", nombre(jeu.parties)],
    ].forEach(([cle, valeur]) => {
      const dt = document.createElement("dt");
      dt.textContent = cle;
      const dd = document.createElement("dd");
      dd.textContent = valeur;
      fiche.append(dt, dd);
    });

    const actions = document.createElement("p");
    actions.className = "une-actions";

    const jouer = document.createElement("a");
    jouer.className = "bouton-jouer";
    jouer.href = jeu.url;
    jouer.textContent = "JOUER MAINTENANT";
    actions.appendChild(jouer);

    if (window.umaFavoris) {
      actions.appendChild(window.umaFavoris.bouton(jeu.id, "bouton-favori"));
    }

    texte.append(titre, rang, desc, fiche, actions);
    une.append(lienImg, texte);
    document.getElementById("bloc-une").hidden = false;
  }

  /* ---------------------------------------------------------
     La grille
     --------------------------------------------------------- */
  function jeuxFiltres() {
    let jeux = JEUX.slice();

    if (etat.favoris && window.umaFavoris) {
      const favoris = window.umaFavoris.liste();
      jeux = jeux.filter((j) => favoris.indexOf(j.id) !== -1);
    }
    if (etat.categorie) {
      jeux = jeux.filter((j) => j.categorie === etat.categorie);
    }
    if (etat.q) {
      const q = etat.q.toLowerCase();
      jeux = jeux.filter((j) =>
        (j.titre + " " + j.description + " " + j.perso + " " + j.categorie)
          .toLowerCase()
          .indexOf(q) !== -1
      );
    }

    const tris = {
      nouveaux: (a, b) => String(b.ajoute_le).localeCompare(String(a.ajoute_le)),
      notes: (a, b) => (b.note || 0) - (a.note || 0),
      parties: (a, b) => (b.parties || 0) - (a.parties || 0),
      alpha: (a, b) => a.titre.localeCompare(b.titre, "fr"),
    };
    const choisi = tris[etat.tri] || tris.nouveaux;

    /* Un jeu pas encore sorti passe toujours après les autres, quel que soit
       le tri. Sans cette clé, « Nouveautés » les mettait en tête : ils n'ont
       pas de date, et "undefined" se compare après n'importe quelle année. */
    const enChantier = (j) => (jouable(j) ? 0 : 1);
    return jeux.sort((a, b) => enChantier(a) - enChantier(b) || choisi(a, b));
  }

  function afficheGrille() {
    const jeux = jeuxFiltres();
    grille.innerHTML = "";
    grille.removeAttribute("aria-busy");

    document.getElementById("grille-compte").textContent =
      jeux.length + (jeux.length > 1 ? " jeux" : " jeu");

    afficheFiltreActif(jeux.length);

    if (!jeux.length) {
      const vide = document.createElement("p");
      vide.className = "chargement";
      vide.textContent = etat.favoris
        ? "Aucun favori pour l'instant. Ouvre un jeu et clique sur ★ Ajouter aux favoris."
        : "Aucun jeu ne correspond. Essaie un autre mot.";
      grille.appendChild(vide);
      return;
    }

    jeux.forEach((jeu, i) => grille.appendChild(carte(jeu, i)));
  }

  function afficheFiltreActif(combien) {
    const zone = document.getElementById("filtre-actif");
    const morceaux = [];
    if (etat.q) morceaux.push('recherche « ' + etat.q + ' »');
    if (etat.categorie) morceaux.push("catégorie " + etat.categorie);
    if (etat.favoris) morceaux.push("mes favoris");

    if (!morceaux.length) {
      zone.hidden = true;
      return;
    }
    zone.hidden = false;
    zone.innerHTML = "";
    zone.append(
      document.createTextNode(
        "Filtre : " + morceaux.join(" + ") + " — " + combien + " résultat" + (combien > 1 ? "s" : "") + ". "
      )
    );
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "filtre-reset";
    reset.textContent = "Tout afficher";
    reset.addEventListener("click", () => {
      etat.q = "";
      etat.categorie = "";
      etat.favoris = false;
      history.replaceState(null, "", location.pathname);
      afficheCategories();
      afficheGrille();
    });
    zone.appendChild(reset);
  }

  function carte(jeu, index) {
    const dispo = jouable(jeu);

    /* Un jeu disponible est un lien, un jeu à venir ne l'est pas : pas de href
       bidon ni de clic à intercepter, le navigateur fait le travail. */
    const el = document.createElement(dispo ? "a" : "div");
    el.className = "carte-jeu" + (dispo ? "" : " bientot");
    el.style.setProperty("--accent", jeu.couleur);
    if (dispo) el.href = jeu.url;
    else el.setAttribute("aria-disabled", "true");

    const cadre = document.createElement("div");
    cadre.className = "carte-vignette";

    const img = document.createElement("img");
    img.src = jeu.vignette;
    img.alt = "";
    img.loading = "lazy";
    cadre.appendChild(img);

    /* Le voile « ▶ JOUER » au survol : le geste des portails de l'époque. */
    const voile = document.createElement("span");
    voile.className = "carte-voile";
    voile.textContent = dispo ? "▶ JOUER" : "PROCHAINEMENT";
    cadre.appendChild(voile);

    if (!dispo) {
      const bientot = document.createElement("span");
      bientot.className = "badge-bientot";
      bientot.textContent = "Bientôt disponible";
      cadre.appendChild(bientot);
    }

    const corps = document.createElement("div");
    corps.className = "carte-corps";

    const titre = document.createElement("h3");
    titre.className = "carte-titre";
    titre.textContent = jeu.titre;

    const cat = document.createElement("span");
    cat.className = "carte-cat";
    cat.textContent = jeu.categorie;

    /* Un jeu pas encore sorti n'a pas de note : on n'affiche pas cinq étoiles
       grises, qui se liraient comme un zéro. */
    corps.appendChild(titre);
    if (typeof jeu.note === "number") corps.appendChild(etoiles(jeu, false));
    corps.appendChild(cat);

    el.append(cadre, corps);
    return el;
  }

  /* ---------------------------------------------------------
     Le classement : ici la numérotation dit quelque chose de vrai,
     c'est un rang, pas une décoration.
     --------------------------------------------------------- */
  function afficheClassement() {
    const jeux = JEUX.filter(jouable)
      .slice()
      .sort((a, b) => (b.parties || 0) - (a.parties || 0));
    if (!jeux.length) return;

    const liste = document.getElementById("classement");
    liste.innerHTML = "";

    jeux.forEach((jeu, i) => {
      const li = document.createElement("li");
      li.className = "rang";
      li.style.setProperty("--accent", jeu.couleur);

      const numero = document.createElement("span");
      numero.className = "rang-numero";
      numero.textContent = i + 1;

      const lien = document.createElement("a");
      lien.className = "rang-lien";
      lien.href = jeu.url;

      const img = document.createElement("img");
      img.className = "rang-vignette";
      img.src = jeu.vignette;
      img.alt = "";
      img.loading = "lazy";

      const texte = document.createElement("span");
      texte.className = "rang-texte";

      const nom = document.createElement("span");
      nom.className = "rang-nom";
      nom.textContent = jeu.titre;

      const sous = document.createElement("span");
      sous.className = "rang-sous";
      sous.textContent = jeu.categorie + " · " + nombre(jeu.parties) + " parties";

      texte.append(nom, sous);
      lien.append(img, texte, etoiles(jeu, false));
      li.append(numero, lien);
      liste.appendChild(li);
    });

    document.getElementById("bloc-top").hidden = false;
  }

  /* ---------------------------------------------------------
     Catégories : les comptes se déduisent du manifest.
     --------------------------------------------------------- */
  function afficheCategories() {
    const comptes = new Map();
    JEUX.forEach((j) => comptes.set(j.categorie, (comptes.get(j.categorie) || 0) + 1));
    if (!comptes.size) return;

    const ul = document.getElementById("categories");
    ul.innerHTML = "";

    const ajoute = (nom, n, actif) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "categorie" + (actif ? " actif" : "");
      b.innerHTML =
        '<span class="categorie-nom"></span><span class="categorie-compte">' + n + "</span>";
      b.querySelector(".categorie-nom").textContent = nom;
      b.addEventListener("click", () => {
        etat.categorie = etat.categorie === nom ? "" : nom;
        if (nom === null) etat.categorie = "";
        afficheCategories();
        afficheGrille();
      });
      li.appendChild(b);
      ul.appendChild(li);
    };

    [...comptes.entries()]
      .sort((a, b) => a[0].localeCompare(b[0], "fr"))
      .forEach(([nom, n]) => ajoute(nom, n, etat.categorie === nom));

    document.getElementById("bloc-categories").hidden = false;
  }


  /* ---------------------------------------------------------
     Le tri
     --------------------------------------------------------- */
  function brancheTri() {
    document.querySelectorAll(".onglet-tri").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.tri === etat.tri));
      b.addEventListener("click", () => {
        etat.tri = b.dataset.tri;
        document.querySelectorAll(".onglet-tri").forEach((autre) => {
          autre.classList.toggle("actif", autre === b);
          autre.setAttribute("aria-selected", String(autre === b));
        });
        afficheGrille();
      });
    });
  }

  function brancheHasardPied() {
    const lien = document.getElementById("pied-hasard");
    const jeux = JEUX.filter(jouable);
    if (!lien || !jeux.length) return;
    lien.addEventListener("click", (e) => {
      e.preventDefault();
      location.href = jeux[Math.floor(Math.random() * jeux.length)].url;
    });
  }

  /* ---------------------------------------------------------
     Le livre d'or : le mur de commentaires de 2012, fautes comprises.
     Trois messages tirés au sort à chaque visite, sur un registre qui
     en compte bien plus — c'est ce qui donne l'impression d'un vrai
     livre d'or plutôt que d'une citation posée là.
     --------------------------------------------------------- */
  const LIVRE_DOR = [
    ["meilleur site de jeu de toute l'internet 10/10", "un visiteur anonyme", "14/12/2012"],
    ["jarrive pas a passer la finale du championnat qq peut maider ???", "xX_lilou_Xx", "09/12/2012"],
    ["trop bien mé sa rame un peu sur le pc du cdi", "kevin_62", "06/12/2012"],
    ["jai fait la pire tenue possible a drew jsuis trop fiere", "Manon♥", "02/12/2012"],
    ["slt qui veut etre mon ami ? repondez svp", "dark_shadow_95", "28/11/2012"],
    ["site pourri............ non jrigole c trop cool", "TheGamerZ", "25/11/2012"],
    ["merci pour les jeux gratuit mon petit fils adore", "mamie_jocelyne", "21/11/2012"],
    ["pk on peut pas mettre une photo de profil ?? svp ajoutez", "lea_du_59", "17/11/2012"],
    ["jsuis premier au classement venez me battre si vous pouvez", "N0OB_KILLER", "12/11/2012"],
    ["ce jeu ma fait louper mon bus", "clément", "08/11/2012"],
    ["mettez plus de jeux de chevaux stp", "poney_lover_2000", "03/11/2012"],
    ["mon frere a casse mon score jvais le tuer", "sarah&co", "29/10/2012"],
  ];

  (function afficheLivreDor() {
    const liste = document.getElementById("livre-dor");
    if (!liste) return;
    const tire = LIVRE_DOR.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    tire.forEach(([mot, pseudo, date]) => {
      const li = document.createElement("li");
      li.className = "livre-mot";
      const p = document.createElement("p");
      p.className = "livre-texte";
      p.textContent = "« " + mot + " »";
      const sig = document.createElement("span");
      sig.className = "livre-signature";
      sig.textContent = "— " + pseudo + ", " + date;
      li.append(p, sig);
      liste.appendChild(li);
    });
    document.getElementById("livre-compte").textContent =
      LIVRE_DOR.length + " messages";
  })();

  /* Petit gadget d'ambiance : une anecdote au hasard à chaque visite. */
  const ANECDOTES = [
    "Ce site est optimisé pour un écran 1024×768 et Internet Explorer 8.",
    "Tous nos jeux sont gratuits et le resteront. Parlez-en autour de vous !",
    "Astuce : cliquez sur ★ pour garder un jeu sous la main à votre prochaine visite.",
    "Le record du staff sur Sanity Whack tient depuis mars. À vous de jouer.",
    "Nos notes sont calculées sur les votes des joueurs, et sur rien d'autre.",
    "Un jeu qui rame ? Fermez les autres onglets, ça aide plus qu'on ne croit.",
  ];
  document.getElementById("anecdote").textContent =
    ANECDOTES[Math.floor(Math.random() * ANECDOTES.length)];
})();
</script>
</body>
</html>
