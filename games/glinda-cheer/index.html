<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>✦ Pep Rally Rhythm ✦</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<!-- DA commune du hub, à charger AVANT le style propre au jeu -->
<link rel="stylesheet" href="../../shared/style-tokens.css" />
<link rel="stylesheet" href="../../shared/components.css" />
<link rel="stylesheet" href="../../shared/navbar.css" />
<link rel="stylesheet" href="../../shared/sidebar.css" />
<link rel="stylesheet" href="../../shared/portail.css" />
<link rel="stylesheet" href="../../shared/skins.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-glinda">
  <div id="sparkles" aria-hidden="true"></div>

  <!-- Barre de navigation permanente du portail -->
  <div id="navbar"></div>

  <div class="page">
    <div class="colonne-jeu">
      <nav id="fil-ariane"></nav>

      <!-- Régie du portail : bannière au-dessus du lecteur -->
      <div class="pub pub-banniere" id="pub-haut"></div>

      <!-- Le lecteur : bande de chargement, jeu encastré, barre d'outils -->
      <div class="lecteur">
        <div id="lecteur-chargement"></div>
        <div class="lecteur-scene">
    <div class="shell">
      <header class="banner">
        <h1 class="wordart" data-text="Pep Rally Rhythm"><span>Pep Rally Rhythm</span></h1>
        <p class="tagline">La foule ne demande qu'à hurler.</p>
      </header>

      <div class="game">
        <!-- ===== Scène : tribunes, Glinda, couloirs de notes ===== -->
        <section class="stage">
          <!-- Le stade : ciel, tribunes bondées, panneau d'affichage,
               terrain de foot US avec ses lignes de yards et ses poteaux -->
          <div class="stade" aria-hidden="true">
            <div class="ciel"></div>

            <!-- Le panneau n'est pas un décor figé : Augusta marque à chaque
                 cran de combo et le chrono descend avec la chorégraphie. -->
            <div class="panneau-score">
              <span class="panneau-ligne">AUGUSTA <b id="tableau-augusta">21</b> — <b>14</b> VISITEURS</span>
              <span class="panneau-ligne petite">4<sup>e</sup> QUART · <span id="tableau-chrono">2:14</span></span>
            </div>

            <div class="tribunes">
              <div id="foule" class="foule"></div>
            </div>

            <div class="terrain">
              <div class="poteaux">
                <svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">
                  <path d="M60 90V46" stroke="#2b1a2e" stroke-width="9" fill="none"/>
                  <path d="M60 88V44" stroke="#ffd84d" stroke-width="5" fill="none"/>
                  <path d="M22 8v40M98 8v40M22 46h76" stroke="#2b1a2e" stroke-width="9" fill="none" stroke-linecap="round"/>
                  <path d="M22 8v40M98 8v40M22 46h76" stroke="#ffd84d" stroke-width="5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="lignes"></div>
            </div>

            <div id="confettis" class="confettis"></div>
          </div>

          <!-- Glinda : sa pose change à chaque touche jouée -->
          <div id="glinda" class="glinda" aria-hidden="true"></div>
          <div id="copine" class="copine" aria-hidden="true"></div>

          <!-- Ce que la foule hurle quand un cran de combo tombe : son propre
               calque, sinon il efface le « PARFAIT ! » qui l'a déclenché. -->
          <p id="cri" class="cri" aria-hidden="true"></p>

          <!-- Piste de jeu : 4 couloirs + ligne de jugement -->
          <div id="piste" class="piste">
            <div class="cadre-avancement" aria-hidden="true">
              <div id="avancement" class="avancement"></div>
            </div>
            <div class="ligne-jugement" aria-hidden="true"></div>
            <div class="couloirs" id="couloirs"></div>
            <p id="jugement" class="jugement" role="status"></p>
          </div>

          <!-- Écrans superposés : accueil, sélection, fin de partie -->
          <div id="ecran" class="ecran">
            <div class="ecran-boite">
              <h2 id="ecran-titre" class="ecran-titre">Choisis ta chorégraphie</h2>
              <p id="ecran-texte" class="ecran-texte">
                Appuie sur ← ↑ → ↓ (ou tape les pompons) quand la note passe sur la ligne.
              </p>
              <!-- Bilan de fin de partie : mention, chiffres, record -->
              <div id="ecran-bilan" class="ecran-bilan"></div>
              <div id="ecran-charts" class="ecran-charts"></div>
              <button id="btn-rejouer" class="fun-btn primary ecran-rejouer" hidden>Rejouer</button>
            </div>
          </div>
        </section>

        <!-- ===== Tableau de bord ===== -->
        <aside class="dock">
          <div class="dock-bloc">
            <span class="dock-etiquette">Score</span>
            <span id="score" class="dock-valeur">0</span>
          </div>

          <div class="dock-bloc">
            <span class="dock-etiquette">Combo</span>
            <span id="combo" class="dock-valeur combo">×1</span>
          </div>

          <div class="dock-bloc">
            <span class="dock-etiquette">Hype</span>
            <div class="hype-cadre">
              <div id="hype-barre" class="hype-barre"></div>
            </div>
            <span id="hype-texte" class="dock-hint">La foule regarde son téléphone.</span>
          </div>

          <div class="dock-bloc dock-stats">
            <span>Parfait <b id="stat-parfait">0</b></span>
            <span>Bien <b id="stat-bien">0</b></span>
            <span>Raté <b id="stat-rate">0</b></span>
            <!-- C'est la précision, pas la hype, qui décide de la mention -->
            <span>Précision <b id="stat-precision">100 %</b></span>
          </div>

          <div class="dock-bloc dock-actions">
            <button id="btn-son" class="fun-btn" aria-pressed="true">🔊 Son</button>
            <button id="btn-stop" class="fun-btn">⏹ Arrêter</button>
          </div>
        </aside>
      </div>

    </div>
        </div>
        <div id="lecteur-outils"></div>
      </div>

      <!-- Fiche du jeu, remplie depuis games-manifest.json -->
      <div id="fiche-jeu"></div>
    </div>

    <div class="colonne-sidebar">
      <!-- Colonne « Tu aimeras aussi... », remplie depuis games-manifest.json -->
      <div id="sidebar-autres-jeux"></div>
      <!-- Régie du portail : pavé sous le rail -->
      <div class="pub pub-pave" id="pub-cote"></div>
    </div>
  </div>

  <!-- Pied de page du portail, commun à toutes les pages -->
  <div id="pied"></div>

  <!-- Les vraies illustrations si elles existent, les SVG sinon.
       `assets/index.js` est écrit par `node outils/scan-assets.js` ;
       absent ou vide, tout retombe sur les dessins. Ces deux lignes
       passent AVANT les scripts du jeu, qui dessinent au chargement. -->
  <script src="../../assets/index.js"></script>
  <script src="../../shared/images.js"></script>
  <script src="../../shared/perso.js"></script>
  <script src="charts.js"></script>
  <script src="main.js"></script>
  <script src="../../shared/favoris.js"></script>
  <script src="../../shared/sparkle.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="../../shared/sidebar.js"></script>
  <script src="../../shared/lecteur.js"></script>
  <script src="../../shared/pub.js"></script>
  <script src="../../shared/pied.js"></script>
  <script>
    renderNavbar("glinda", "navbar");
    renderSidebar("glinda", "sidebar-autres-jeux");
    renderPied("pied");
    renderPubs([["pub-haut", "banniere"], ["pub-cote", "pave"]]);
    renderLecteur("glinda");
  </script>
</body>
</html>
