<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>💘 Love Tester 💘</title>
<link rel="icon" type="image/svg+xml" href="../../shared/vignettes/love-tester.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<!-- DA commune du hub, à charger AVANT le style propre au jeu -->
<link rel="stylesheet" href="../../shared/style-tokens.css" />
<link rel="stylesheet" href="../../shared/components.css" />
<link rel="stylesheet" href="../../shared/navbar.css" />
<link rel="stylesheet" href="../../shared/sidebar.css" />
<link rel="stylesheet" href="../../shared/portail.css" />
<link rel="stylesheet" href="../../shared/skins.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-love-tester">
  <div id="sparkles" aria-hidden="true"></div>

  <!-- En-tête du portail : barre de service, navigation, annonces -->
  <div id="navbar"></div>

  <div class="page">
    <div class="colonne-jeu">
      <nav id="fil-ariane"></nav>

      <!-- Régie du portail : bannière au-dessus du lecteur -->
      <div class="pub pub-banniere" id="pub-haut"></div>

      <!-- Le lecteur : bande de chargement, jeu encastré, barre d'outils -->
      <div class="lecteur">
        <div id="lecteur-chargement"></div>
        <div class="lecteur-scene">
          <div class="shell">
            <header class="banner">
              <h1 class="wordart" data-text="Love Tester"><span>Love Tester</span></h1>
              <p class="tagline">Deux prénoms, un pourcentage. Étalonnée en 2012, jamais révisée depuis.</p>
            </header>

            <div class="lt-jeu">
              <!-- ===== La machine ===== -->
              <form class="lt-machine" id="lt-machine" autocomplete="off" novalidate>
                <div class="lt-pupitre">
                  <!-- Prénom de gauche -->
                  <div class="lt-place">
                    <div class="lt-portrait" id="lt-portrait-a" aria-hidden="true"></div>
                    <p class="lt-identite" id="lt-identite-a">&nbsp;</p>
                    <label class="lt-etiquette" for="lt-nom-a">Premier prénom</label>
                    <input class="lt-saisie" id="lt-nom-a" name="a" type="text"
                           maxlength="22" spellcheck="false" placeholder="Drew" />
                  </div>

                  <!-- Le cœur, le cadran et la colonne de voyants -->
                  <div class="lt-noyau">
                    <div class="lt-coeur">
                      <svg class="lt-coeur-svg" viewBox="0 0 120 112" role="img"
                           aria-labelledby="lt-coeur-titre">
                        <title id="lt-coeur-titre">Jauge de compatibilité</title>
                        <defs>
                          <clipPath id="lt-decoupe">
                            <path d="M60 106C20 78 8 60 8 41 8 23 22 9 40 9c9 0 16 5 20 12 4-7 11-12 20-12 18 0 32 14 32 32 0 19-12 37-52 65z" />
                          </clipPath>
                          <linearGradient id="lt-jus" x1="0" y1="1" x2="0" y2="0">
                            <stop offset="0" stop-color="#e0005f" />
                            <stop offset="0.55" stop-color="#ff3d9a" />
                            <stop offset="1" stop-color="#ff9ecb" />
                          </linearGradient>
                        </defs>
                        <g clip-path="url(#lt-decoupe)">
                          <rect x="0" y="0" width="120" height="112" fill="#ffe3f1" />
                          <!-- Le remplissage : seul son `y` bouge, piloté par main.js -->
                          <rect id="lt-remplissage" x="0" y="112" width="120" height="112"
                                fill="url(#lt-jus)" />
                          <path id="lt-vague" d="" fill="#ffffff" opacity=".35" />
                        </g>
                        <path d="M60 106C20 78 8 60 8 41 8 23 22 9 40 9c9 0 16 5 20 12 4-7 11-12 20-12 18 0 32 14 32 32 0 19-12 37-52 65z"
                              fill="none" stroke="#6d0033" stroke-width="6" stroke-linejoin="round" />
                      </svg>
                    </div>

                    <!-- Cadran à chiffres, façon compteur de visites -->
                    <p class="lt-afficheur"><span id="lt-chiffres">---</span><b>%</b></p>

                    <!-- Les sept voyants, remplis depuis DONNEES_LOVE.TRANCHES -->
                    <ol class="lt-echelle" id="lt-echelle" aria-hidden="true"></ol>
                  </div>

                  <!-- Prénom de droite -->
                  <div class="lt-place">
                    <div class="lt-portrait" id="lt-portrait-b" aria-hidden="true"></div>
                    <p class="lt-identite" id="lt-identite-b">&nbsp;</p>
                    <label class="lt-etiquette" for="lt-nom-b">Second prénom</label>
                    <input class="lt-saisie" id="lt-nom-b" name="b" type="text"
                           maxlength="22" spellcheck="false" placeholder="Glinda" />
                  </div>
                </div>

                <div class="lt-commandes">
                  <button type="submit" class="fun-btn primary lt-gros-bouton" id="lt-tester">
                    Tester notre amour
                  </button>
                  <button type="button" class="fun-btn" id="lt-inverser">⇄ Inverser</button>
                  <button type="button" class="fun-btn lt-son" id="lt-son"
                          aria-pressed="false" title="Sons de la machine">♪ Son</button>
                </div>

                <p class="lt-console" id="lt-console" role="status">
                  Entre deux prénoms, puis appuie sur le gros bouton.
                </p>
              </form>

              <!-- ===== Le verdict, rempli par main.js ===== -->
              <section class="lt-verdict" id="lt-verdict" aria-live="polite"></section>

              <!-- ===== Le bas de la machine : le carnet ===== -->
              <div class="lt-bas">
                <section class="lt-bloc">
                  <h2 class="lt-titre-bloc">Mon carnet</h2>
                  <p class="lt-sous-titre">Tes derniers relevés, du plus prometteur au pire.</p>
                  <ol class="lt-carnet" id="lt-carnet"></ol>
                  <button type="button" class="fun-btn lt-petit-bouton" id="lt-vider">
                    Effacer le carnet
                  </button>
                </section>
              </div>
            </div>
          </div>
        </div>
        <div id="lecteur-outils"></div>
      </div>

      <!-- Fiche du jeu, remplie depuis games-manifest.json -->
      <div id="fiche-jeu"></div>
    </div>

    <div class="colonne-sidebar">
      <!-- Colonne « Tu aimeras aussi... », remplie depuis games-manifest.json -->
      <div id="sidebar-autres-jeux"></div>
      <!-- Régie du portail : pavé sous le rail -->
      <div class="pub pub-pave" id="pub-cote"></div>
    </div>
  </div>

  <!-- Pied de page du portail, commun à toutes les pages -->
  <div id="pied"></div>

  <script src="../../shared/perso.js"></script>
  <script src="hachage.js"></script>
  <script src="verdicts.js"></script>
  <script src="main.js"></script>
  <script src="../../shared/favoris.js"></script>
  <script src="../../shared/sparkle.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="../../shared/sidebar.js"></script>
  <script src="../../shared/lecteur.js"></script>
  <script src="../../shared/pub.js"></script>
  <script src="../../shared/pied.js"></script>
  <script>
    renderNavbar("love-tester", "navbar");
    renderSidebar("love-tester", "sidebar-autres-jeux");
    renderPied("pied");
    renderLecteur("love-tester");
    renderPubs([["pub-haut", "banniere"], ["pub-cote", "pave"]]);
  </script>
</body>
</html>
