<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>✿ Dress my Drew ✿</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet" />
<!-- DA commune du hub, à charger AVANT le style propre au jeu -->
<link rel="stylesheet" href="../../shared/style-tokens.css" />
<link rel="stylesheet" href="../../shared/components.css" />
<link rel="stylesheet" href="../../shared/navbar.css" />
<link rel="stylesheet" href="../../shared/sidebar.css" />
<link rel="stylesheet" href="../../shared/portail.css" />
<link rel="stylesheet" href="../../shared/skins.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="theme-drew">
  <div id="sparkles" aria-hidden="true"></div>

  <!-- Barre de navigation permanente du portail -->
  <div id="navbar"></div>

  <div class="page">
    <div class="colonne-jeu">
      <nav id="fil-ariane"></nav>

      <!-- Régie du portail : bannière au-dessus du lecteur -->
      <div class="pub pub-banniere" id="pub-haut"></div>

      <!-- Le lecteur : bande de chargement, jeu encastré, barre d'outils -->
      <div class="lecteur">
        <div id="lecteur-chargement"></div>
        <div class="lecteur-scene">
  <div class="shell">
    <header class="banner">
      <h1 class="wordart" data-text="Dress my Drew"><span>Dress my Drew</span></h1>
      <p class="tagline">L'aigle surveille tes choix vestimentaires.</p>
    </header>

    <div class="game">
      <section class="stage">
        <div class="stage-tools stage-tools-gauche">
          <button id="btn-chaos" class="round-btn chaos" title="Habiller Drew au hasard">
            <span aria-hidden="true">🎲</span><span class="round-label">Chaos</span>
          </button>
          <button id="btn-eagle" class="round-btn eagle" title="Tout retirer">
            <span aria-hidden="true">🦅</span><span class="round-label">Aigle</span>
          </button>
        </div>

        <div class="stage-tools stage-tools-droite">
          <button id="btn-export" class="round-btn primary" title="Enregistrer la tenue en PNG">
            <span aria-hidden="true">📸</span><span class="round-label">Photo</span>
          </button>
        </div>

        <div class="doll-fit">
          <div class="doll-frame">
            <div id="doll"></div>
            <div id="eagle-anim" aria-hidden="true">
              <span class="eagle-corps">🦅</span>
            </div>
          </div>
        </div>

        <p id="flavor-text" role="status"><span id="flavor-texte"></span></p>

        <!-- Le Drewmètre. Hauteur FIXE, comme la bulle : si ce bloc grandit,
             la scène rétrécit et Drew change de taille à chaque pièce. -->
        <div class="gout" id="gout">
          <div class="gout-tete">
            <span class="gout-nom">Drewmètre</span>
            <span class="gout-palier" id="gout-palier">—</span>
            <span class="gout-chiffres"><b id="gout-score">0</b><small id="gout-record"></small></span>
          </div>
          <div class="gout-jauge">
            <i class="gout-remplissage" id="gout-remplissage"></i>
            <i class="gout-marque" id="gout-marque" hidden></i>
          </div>
          <div class="gout-combos gout-combos-vide" id="gout-combos"></div>
        </div>
      </section>

      <aside class="dock">
        <div id="wardrobe-tabs" class="dock-cats" role="tablist" aria-label="Catégories de vêtements"></div>
        <div class="dock-items">
          <div id="dock-entete" class="dock-entete"></div>
          <div id="wardrobe-panels" class="dock-panels"></div>
          <p class="dock-hint">Touche une pièce pour l'enfiler, touche-la encore pour la retirer. À la souris, tu peux aussi l'attraper et la lâcher sur Drew.</p>
        </div>
      </aside>
    </div>

  </div>
        </div>
        <div id="lecteur-outils"></div>
      </div>

      <!-- Fiche du jeu, remplie depuis games-manifest.json -->
      <div id="fiche-jeu"></div>
    </div>

    <div class="colonne-sidebar">
      <!-- Colonne « Tu aimeras aussi... », remplie depuis games-manifest.json -->
      <div id="sidebar-autres-jeux"></div>
      <!-- Régie du portail : pavé sous le rail -->
      <div class="pub pub-pave" id="pub-cote"></div>
    </div>
  </div>

  <!-- Pied de page du portail, commun à toutes les pages -->
  <div id="pied"></div>

  <script src="layers.js"></script>
  <script src="decors.js"></script>
  <script src="silhouettes.js"></script>
  <script src="gout.js"></script>
  <script src="main.js"></script>
  <script src="export.js"></script>
  <script src="../../shared/favoris.js"></script>
  <script src="../../shared/sparkle.js"></script>
  <script src="../../shared/navbar.js"></script>
  <script src="../../shared/sidebar.js"></script>
  <script src="../../shared/lecteur.js"></script>
  <script src="../../shared/pub.js"></script>
  <script src="../../shared/pied.js"></script>
  <script>
    renderNavbar("drew", "navbar");
    renderSidebar("drew", "sidebar-autres-jeux");
    renderPied("pied");
    renderPubs([["pub-haut", "banniere"], ["pub-cote", "pave"]]);
    renderLecteur("drew");
  </script>
</body>
</html>
