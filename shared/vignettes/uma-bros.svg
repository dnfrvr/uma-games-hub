<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="UMA Bros">
  <!-- Vignette placeholder — à remplacer par une vraie image quand l'art sera prêt. -->
  <rect width="320" height="240" fill="#4ba3e3"/>
  <rect width="320" height="240" fill="url(#bros-rayures)"/>
  <defs>
    <pattern id="bros-rayures" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#ffffff" opacity=".14"/>
    </pattern>
  </defs>

  <!-- nuages -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="58" cy="46" rx="26" ry="15"/><ellipse cx="82" cy="48" rx="20" ry="12"/>
    <ellipse cx="252" cy="34" rx="22" ry="13"/><ellipse cx="274" cy="38" rx="16" ry="10"/>
  </g>

  <!-- le sol, avec un trou -->
  <path d="M0 190h124v50H0z" fill="#5aa02c" stroke="#2b1a2e" stroke-width="8"/>
  <path d="M176 190h144v50H176z" fill="#5aa02c" stroke="#2b1a2e" stroke-width="8"/>

  <!-- une plateforme en l'air -->
  <rect x="120" y="128" width="80" height="18" rx="4" fill="#ffd84d" stroke="#2b1a2e" stroke-width="7"/>

  <!-- le drapeau d'arrivée -->
  <rect x="288" y="96" width="8" height="94" fill="#dcdcdc" stroke="#2b1a2e" stroke-width="6"/>
  <path d="M294 104h44l-13 16 13 16h-44z" fill="#e91e8c" stroke="#2b1a2e" stroke-width="6" stroke-linejoin="round"/>

  <!-- le personnage en plein saut -->
  <g stroke="#2b1a2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="86" cy="104" r="22" fill="#f8dcc0"/>
    <path d="M86 126v34"/>
    <path d="M86 160l-18 26M86 160l20 24"/>
    <path d="M86 136l-28-10M86 136l30-16"/>
  </g>

  <!-- le cafard, en dessous -->
  <g transform="translate(206 156)">
    <ellipse cx="17" cy="12" rx="15" ry="9" fill="#7a4a1e" stroke="#2b1a2e" stroke-width="6"/>
    <circle cx="4" cy="9" r="5" fill="#5a3414" stroke="#2b1a2e" stroke-width="5"/>
    <g stroke="#2b1a2e" stroke-width="5" stroke-linecap="round">
      <path d="M9 20l-5 6M25 20l5 6M1 3l-4-5"/>
    </g>
  </g>

  <g fill="#ffd84d">
    <path d="M30 84l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/>
  </g>
</svg>
