    <ellipse cx="230" cy="176" rx="44" ry="18"/>
  </g>
  <!-- petit gris qui sort d'un trou -->
  <g stroke="#1a1c33" stroke-width="8" stroke-linejoin="round">
    <path d="M90 178c-26 0-38-22-38-42s17-36 38-36 38 16 38 36-12 42-38 42z" fill="#c6ff4d"/>
    <path d="M74 116c6-6 14-6 18 2M106 116c-6-6-14-6-18 2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- ovni -->
  <g stroke="#1a1c33" stroke-width="8" stroke-linejoin="round">
    <path d="M212 74a20 20 0 0 1 36 0z" fill="#ffffff"/>
    <ellipse cx="230" cy="80" rx="46" ry="14" fill="#4de0ff"/>
