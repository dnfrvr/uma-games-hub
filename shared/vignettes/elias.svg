<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="Sanity Whack">
  <!-- Vignette placeholder — à remplacer par une vraie image quand l'art sera prêt. -->
  <rect width="320" height="240" fill="#6672d0"/>
  <rect width="320" height="240" fill="url(#elias-rayures)"/>
  <defs>
    <pattern id="elias-rayures" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#ffffff" opacity=".16"/>
    </pattern>
  </defs>
  <!-- trous -->
  <g fill="#2a2f5c" stroke="#1a1c33" stroke-width="6">
